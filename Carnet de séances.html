<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de séances</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1b1d1f;--mu:#6b7076;--bd:#e2e2dc;--ac:#e8590c;--ok:#2f9e44;--ov:#7048e8;--okbg:#e6f4ea;--ovbg:#ece6fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--card:#1f2123;--tx:#f0f0ee;--mu:#9a9fa5;--bd:#32353a;--okbg:#17301f;--ovbg:#26204a}}
:root[data-theme="dark"]{--bg:#141516;--card:#1f2123;--tx:#f0f0ee;--mu:#9a9fa5;--bd:#32353a;--okbg:#17301f;--ovbg:#26204a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:4px 0 14px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;width:42px;height:42px;font-size:1.2rem;cursor:pointer}
.nav div{text-align:center;font-weight:600}
.nav small{display:block;color:var(--mu);font-weight:400}
.banner{border-radius:14px;padding:14px;margin-bottom:14px;background:var(--card);border:1px solid var(--bd)}
.banner.ok{background:var(--okbg);border-color:var(--ok)}
.banner.ov{background:var(--ovbg);border-color:var(--ov)}
.banner b{font-size:1.05rem}
.bar{height:8px;border-radius:99px;background:var(--bd);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.banner.ok .bar i{background:var(--ok)}.banner.ov .bar i{background:var(--ov)}
.sub{color:var(--mu);font-size:.85rem;margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row.extra{border-style:dashed}
.name{font-weight:600;min-width:0}
.name small{display:block;color:var(--mu);font-weight:400;font-size:.8rem}
.name input{font:inherit;font-weight:600;color:var(--tx);background:transparent;border:0;border-bottom:1px dashed var(--bd);width:100%;padding:0}
.checks{display:flex;gap:8px;flex-shrink:0}
.cb{width:44px;height:44px;border-radius:12px;border:2px solid var(--bd);background:transparent;color:#fff;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb.on.second{background:var(--ov);border-color:var(--ov)}
.tag{font-size:.7rem;padding:2px 8px;border-radius:99px;background:var(--okbg);color:var(--ok);margin-left:6px;vertical-align:middle}
.tag.ov{background:var(--ovbg);color:var(--ov)}
h2{font-size:1rem;margin:22px 0 8px}
.hist{display:flex;justify-content:space-between;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:6px;font:inherit;cursor:pointer}
.hist span:last-child{color:var(--mu);font-size:.85rem}
.empty{color:var(--mu);font-size:.9rem}
.foot{margin-top:20px;display:flex;justify-content:space-between;gap:8px}
.foot button{background:none;border:0;color:var(--mu);font-size:.8rem;cursor:pointer;text-decoration:underline;padding:4px}
</style>
</head>
<body>
<main>
<h1>🏋️ Carnet de séances</h1>
<div class="nav">
<button id="prev" aria-label="Semaine précédente">‹</button>
<div id="wlabel"></div>
<button id="next" aria-label="Semaine suivante">›</button>
</div>
<div id="banner"></div>
<div id="list"></div>
<h2>Historique</h2>
<div id="hist"></div>
<div class="foot"><button id="today">Revenir à cette semaine</button><button id="reset">Tout effacer</button></div>
</main>
<script>
var MAIN=[["legs","Jambes"],["shoulders","Épaules / Dos"],["arms","Bras / Pecs"],["abs","Abdos"],["calis","Callisthénie"]];
var KEY="carnet-seances-v1";
var state={custom:"Autre séance",weeks:{}};
try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(p&&p.weeks)state=p;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function iso(d){var m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(j<10?"0":"")+j;}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x;}
var cur=monday(new Date());
function fmt(d){return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});}
function getWeek(k){return state.weeks[k]||{};}
function count(w,id){var a=w[id]||[false,false];return (a[0]?1:0)+(a[1]?1:0);}
function status(w){
  var done=0,dbl=0;
  MAIN.forEach(function(m){var c=count(w,m[0]);if(c>=1)done++;if(c>=2)dbl++;});
  return {done:done,dbl:dbl,reached:done===5,over:dbl===5};
}
function render(){
  var k=iso(cur),w=getWeek(k),st=status(w);
  var end=new Date(cur);end.setDate(end.getDate()+6);
  document.getElementById("wlabel").innerHTML="Semaine du "+fmt(cur)+" au "+fmt(end)+(k===iso(monday(new Date()))?"<small>Cette semaine</small>":"");
  var cls="banner",title,sub;
  if(st.over){cls+=" ov";title="🏆 Objectif dépassé !";sub="Les 5 séances ont été faites 2 fois.";}
  else if(st.reached){cls+=" ok";title="✅ Objectif atteint !";sub=st.dbl+"/5 séances doublées — continue pour dépasser l'objectif.";}
  else{title=st.done+"/5 séances réalisées";sub="Fais chaque séance au moins une fois pour atteindre l'objectif.";}
  var pct=st.over?100:Math.round(st.done/5*100);
  document.getElementById("banner").innerHTML='<div class="'+cls+'"><b>'+title+'</b><div class="sub">'+sub+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  var h="";
  MAIN.forEach(function(m){h+=row(m[0],m[1],w,false);});
  h+=row("extra",null,w,true);
  document.getElementById("list").innerHTML=h;
  document.querySelectorAll(".cb").forEach(function(b){b.onclick=function(){toggle(b.dataset.id,+b.dataset.i);};});
  var inp=document.getElementById("cname");
  inp.onchange=function(){state.custom=inp.value||"Autre séance";save();};
  renderHist();
}
function row(id,label,w,extra){
  var a=w[id]||[false,false],c=count(w,id);
  var tag=(!extra&&c===2)?'<span class="tag ov">doublée</span>':(!extra&&c===1?'<span class="tag">faite</span>':'');
  var name=extra?'<div class="name"><input id="cname" value="'+state.custom.replace(/"/g,"&quot;")+'" maxlength="30" aria-label="Nom de la séance libre"><small>Séance libre (hors objectif)</small></div>':'<div class="name">'+label+tag+'</div>';
  var btns="";
  for(var i=0;i<2;i++){btns+='<button class="cb'+(a[i]?" on":"")+(i===1?" second":"")+'" data-id="'+id+'" data-i="'+i+'" aria-label="'+(extra?"Séance libre":label)+' — séance '+(i+1)+'">'+(a[i]?"✓":"")+'</button>';}
  return '<div class="row'+(extra?" extra":"")+'">'+name+'<div class="checks">'+btns+'</div></div>';
}
function toggle(id,i){
  var k=iso(cur);
  if(!state.weeks[k])state.weeks[k]={};
  var a=state.weeks[k][id]||[false,false];
  a=a.slice();a[i]=!a[i];
  state.weeks[k][id]=a;
  save();render();
}
function renderHist(){
  var keys=Object.keys(state.weeks).filter(function(k){
    var w=state.weeks[k];return Object.keys(w).some(function(id){return count(w,id)>0;});
  }).sort().reverse();
  var el=document.getElementById("hist");
  if(!keys.length){el.innerHTML='<div class="empty">Aucune séance enregistrée pour le moment.</div>';return;}
  el.innerHTML=keys.map(function(k){
    var st=status(state.weeks[k]),d=new Date(k+"T00:00:00");
    var lab=st.over?"🏆 Dépassé":st.reached?"✅ Atteint":st.done+"/5";
    return '<button class="hist" data-k="'+k+'"><span>Semaine du '+fmt(d)+'</span><span>'+lab+(st.reached&&!st.over?" · "+st.dbl+" doublées":"")+'</span></button>';
  }).join("");
  el.querySelectorAll(".hist").forEach(function(b){b.onclick=function(){cur=new Date(b.dataset.k+"T00:00:00");render();window.scrollTo(0,0);};});
}
document.getElementById("prev").onclick=function(){cur.setDate(cur.getDate()-7);render();};
document.getElementById("next").onclick=function(){cur.setDate(cur.getDate()+7);render();};
document.getElementById("today").onclick=function(){cur=monday(new Date());render();};
document.getElementById("reset").onclick=function(){if(confirm("Effacer tout l'historique ?")){state={custom:"Autre séance",weeks:{}};save();render();}};
render();
</script>
</body>
</html>
